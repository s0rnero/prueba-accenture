spring:
  application:
    name: franchises
  codec:
    max-in-memory-size: ${SPRING_CODEC_MAX_IN_MEMORY_SIZE:2MB}
  lifecycle:
    timeout-per-shutdown-phase: ${SPRING_SHUTDOWN_TIMEOUT:20s}

  r2dbc:
    url: ${DATABASE_URL:r2dbc:postgresql://localhost:5432/franchises}
    username: ${DATABASE_USER:franchises}
    password: ${DATABASE_PASSWORD:franchises}
    pool:
      enabled: true
      initial-size: ${R2DBC_POOL_INITIAL_SIZE:2}
      min-idle: ${R2DBC_POOL_MIN_IDLE:2}
      max-size: ${R2DBC_POOL_MAX_SIZE:10}
      max-acquire-time: ${R2DBC_POOL_MAX_ACQUIRE_TIME:5s}
      max-create-connection-time: ${R2DBC_POOL_MAX_CREATE_CONNECTION_TIME:5s}
      max-idle-time: ${R2DBC_POOL_MAX_IDLE_TIME:10m}
      max-life-time: ${R2DBC_POOL_MAX_LIFE_TIME:30m}
      validation-query: ${R2DBC_POOL_VALIDATION_QUERY:SELECT 1}

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    url: ${JDBC_URL:jdbc:postgresql://localhost:5432/franchises}
    user: ${DATABASE_USER:franchises}
    password: ${DATABASE_PASSWORD:franchises}
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

app:
  security:
    jwt-secret: ${JWT_SECRET:}
    token-ttl: ${TOKEN_TTL:PT30M}
    cookie-secure: ${COOKIE_SECURE:true}
    cookie-same-site: ${COOKIE_SAME_SITE:Lax}
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:https://prueba-accenture.com,http://localhost:4200}

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
