<label class="flex flex-col gap-1">
  <span class="block text-xs font-medium tracking-wide text-neutral-500 uppercase">
    {{ label() }}
  </span>
  <input
    [type]="type()"
    [value]="value()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    (input)="onInput($event)"
    (blur)="onTouched()"
    class="focus:border-accenture w-full rounded-lg border border-neutral-300 bg-white px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-neutral-300 disabled:bg-neutral-100"
  />
</label>
