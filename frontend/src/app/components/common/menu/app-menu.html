@if (open()) {
<button
  type="button"
  class="fixed inset-0 z-30"
  aria-label="Cerrar menú"
  (click)="closed.emit()"
  animate.enter="fade-in"
  animate.leave="fade-out"
></button>
<div
  class="absolute top-full right-0 z-40 mt-2 flex w-52 flex-col overflow-hidden rounded-xl bg-neutral-100 shadow-xl md:top-auto md:right-auto md:bottom-full md:left-0 md:mt-0 md:mb-2"
  animate.enter="menu-in"
  animate.leave="menu-out"
>
  <ng-content />
</div>
}
