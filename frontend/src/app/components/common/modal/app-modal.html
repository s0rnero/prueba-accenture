@if (open()) {
<button
  type="button"
  class="fixed inset-0 z-50 bg-neutral-800"
  aria-label="Cerrar"
  (click)="closed.emit()"
  animate.enter="fade-in"
  animate.leave="fade-out"
></button>
<div class="pointer-events-none fixed inset-0 z-50 flex items-center justify-center px-4">
  <div
    class="pointer-events-auto w-full max-w-md rounded-2xl bg-neutral-100 p-6 shadow-2xl"
    animate.enter="modal-in"
    animate.leave="modal-out"
  >
    <ng-content />
  </div>
</div>
}
