<aside
  class="flex shrink-0 items-center gap-2 border-b border-neutral-200 bg-white p-2 md:h-screen md:w-60 md:flex-col md:items-stretch md:border-r md:border-b-0"
>
  <a routerLink="/" class="shrink-0 p-2 text-lg font-semibold">
    Acento<span class="text-accenture">.</span>
  </a>

  <nav
    class="flex flex-1 items-center justify-center gap-1 overflow-x-auto text-sm md:flex-col md:items-stretch md:justify-start md:overflow-x-visible"
  >
    @for (view of views(); track view.label) {
    <a
      [routerLink]="view.link"
      [class]="
        (view.active ? 'bg-accenture text-white' : 'text-black hover:bg-neutral-200') +
        ' ' +
        (view.active ? 'gap-2' : 'gap-0 md:gap-2')
      "
      class="flex shrink-0 items-center rounded-lg p-2 transition-all duration-300"
      [title]="view.label"
    >
      <span>{{ view.emoji }}</span>
      <span
        [class]="
          (view.active ? 'max-w-40' : 'max-w-0 md:max-w-40') +
          ' overflow-hidden whitespace-nowrap transition-all duration-300'
        "
        >{{ view.label }}</span
      >
    </a>
    }
  </nav>

  <div class="relative shrink-0 md:w-full">
    <button
      type="button"
      class="flex items-center justify-between gap-2 rounded-lg p-2 hover:bg-neutral-200 md:w-full"
      (click)="toggleMenu()"
    >
      <span
        class="bg-accenture flex h-8 w-8 shrink-0 items-center justify-center rounded-full text-xs font-semibold text-white"
      >
        {{ initials() }}
      </span>
      <span class="hidden text-sm md:inline"> {{ auth.session()?.displayName }} </span>
      <span class="font-semibold" aria-hidden="true">⋯</span>
    </button>

    <app-menu [open]="menuOpen()" (closed)="closeMenu()">
      <button
        type="button"
        class="w-full px-3 py-2 text-sm hover:bg-neutral-100"
        (click)="openProfile()"
      >
        ✏️ Editar usuario
      </button>
      <button
        type="button"
        class="w-full px-3 py-2 text-sm text-red-600 hover:bg-neutral-100"
        (click)="logout()"
      >
        🚪 Cerrar sesión
      </button>
    </app-menu>
  </div>
</aside>

<app-user-form [open]="editing()" (closed)="editing.set(false)" />
