<aside class="flex h-screen w-60 flex-col border-r border-neutral-200 bg-white p-2">
  <a routerLink="/" class="p-2 text-lg font-semibold">
    Acento<span class="text-accenture">.</span>
  </a>

  <nav class="flex flex-1 flex-col gap-1 text-sm">
    @for (view of views(); track view.label) {
    <a
      [routerLink]="view.link"
      [class]="view.active ? 'bg-accenture text-white' : 'text-black hover:bg-neutral-200'"
      class="flex items-center gap-2 rounded-lg p-2 transition-all"
      [title]="view.label"
    >
      <span>{{ view.emoji }}</span>
      <span>{{ view.label }}</span>
    </a>
    }
  </nav>

  <div class="relative">
    <button
      type="button"
      class="flex w-full items-center justify-between gap-2 rounded-lg p-2 hover:bg-neutral-200"
      (click)="toggleMenu()"
    >
      <span
        class="bg-accenture flex h-8 w-8 items-center justify-center rounded-full text-xs font-semibold text-white"
      >
        {{ initials() }}
      </span>
      <span class="text-sm"> {{ auth.session()?.displayName }} </span>
      <span class="font-semibold" aria-hidden="true">⋯</span>
    </button>

    <app-menu [open]="menuOpen()" (closed)="closeMenu()">
      <button
        type="button"
        class="w-full px-3 py-2 text-sm hover:bg-neutral-100"
        (click)="openProfile()"
      >
        ✏️ Editar usuario
      </button>
      <button
        type="button"
        class="w-full px-3 py-2 text-sm text-red-600 hover:bg-neutral-100"
        (click)="logout()"
      >
        🚪 Cerrar sesión
      </button>
    </app-menu>
  </div>
</aside>

<app-user-form [open]="editing()" (closed)="editing.set(false)" />
