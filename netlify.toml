[build]
  command = "npm --prefix frontend install && npm --prefix frontend run build"
  publish = "frontend/dist/frontend/browser"

[build.environment]
  NODE_VERSION = "26"

[[redirects]]
  from = "/api/*"
  to = "https://acento-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
